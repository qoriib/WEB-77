<section id="join">
  <h2 class="section-heading">Join Our Sweet Squad 💕</h2>
  <p class="section-subtitle">
    Sign up to join the Emina beauty club and get early access to limited
    launches, beauty classes, and surprise gifts!
  </p>
  <div class="form-card">
    <form id="join-form" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Aurora F."
          required
        />
        <small class="error-message" id="name-error"></small>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="beauty@emina.co.id"
          required
        />
        <small class="error-message" id="email-error"></small>
      </div>
      <div class="field">
        <label for="password">Create Password</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="6"
          required
        />
        <small class="error-message" id="password-error"></small>
      </div>
      <div class="field">
        <label for="story">Tell us about your skin story</label>
        <textarea
          id="story"
          name="story"
          placeholder="Combination skin & loves gentle glow..."
          required
        ></textarea>
        <small class="error-message" id="story-error"></small>
      </div>
      <div class="field">
        <span class="label">Skin Type</span>
        <div class="choices">
          <label>
            <input type="radio" name="skin" value="normal" required />
            Normal
          </label>
          <label>
            <input type="radio" name="skin" value="dry" />
            Dry
          </label>
          <label>
            <input type="radio" name="skin" value="oily" />
            Oily
          </label>
          <label>
            <input type="radio" name="skin" value="combo" />
            Combination
          </label>
        </div>
        <small class="error-message" id="skin-error"></small>
      </div>
      <div class="field">
        <label for="favorite">Favorite Emina Product</label>
        <select id="favorite" name="favorite" required>
          <option value="">Choose one ✨</option>
          <option value="bright-stuff">Bright Stuff Serum</option>
          <option value="sun-protection">Sun Protection SPF 30</option>
          <option value="creamy-tint">Creamy Tint</option>
          <option value="skin-buddy">Skin Buddy Cleanser</option>
        </select>
        <small class="error-message" id="favorite-error"></small>
      </div>
      <div class="field">
        <div class="choices">
          <label>
            <input type="checkbox" name="agree" id="agree" required />
            I agree to receive beauty updates and tips.
          </label>
          <label>
            <input type="checkbox" name="community" id="community" />
            Add me to community events invites.
          </label>
        </div>
        <small class="error-message" id="agree-error"></small>
      </div>
      <button type="submit" class="submit-btn">Join the Club</button>
    </form>
  </div>
</section>

<div class="form-popup" id="form-popup" aria-hidden="true">
  <div class="form-popup-backdrop"></div>
  <div class="form-popup-content" role="dialog" aria-labelledby="form-popup-title">
    <button type="button" class="form-popup-close" aria-label="Close welcome message">
      <i class="fa-solid fa-times"></i>
    </button>
    <h3 id="form-popup-title">Welcome to the Glow Squad! ✨</h3>
    <p id="form-popup-message">
      Thank you for joining. Keep an eye on your inbox for the sweetest updates and invites.
    </p>
    <button type="button" class="form-popup-cta" id="form-popup-cta">Got it!</button>
  </div>
</div>
